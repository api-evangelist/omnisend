notes:
- The OpenAPI contracts declare only contacts.read and contacts.write inside the Bearer securityScheme; every other
  scope requirement is stated in prose in the per-operation description ("**Scopes:** `campaigns.write`"), not in
  the machine-readable security block.
- The Event Metadata API operations declare no scope in the spec at all — the derived entry "none" below is an artifact
  of that omission, not a claim that the operations are unauthenticated. The docs state events.write for create/update.
- forms.read / forms.write and brand-assets.* have no published OpenAPI at all; the Forms surface is reachable only
  through the MCP server.
- Client credentials are not self-serve — the OAuth page asks integrators to submit a Google Form and promises credentials
  in 1-3 business days. The MCP hosts advertise RFC 7591 dynamic client registration, which is a different and faster
  path.
- Access tokens are documented as effectively non-expiring (expires_in 9223372036) unless revoked.
