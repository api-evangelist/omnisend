docs: https://api-docs.omnisend.com/reference/oauth
description: 'OAuth 2.0 scopes for Omnisend. The authoritative list is the provider''s own RFC 8414 authorization
  server metadata, which declares 26 scopes — six more than any OpenAPI contract exposes. The RFC 9728 protected-resource
  metadata on the MCP host declares a 22-scope subset: the four missing there (accounts.write, sessions.write, reports.read,
  brand-assets.write) are account-level scopes the MCP agent surface deliberately does not offer. Scope names are
  resource.action and map cleanly onto the API resources.'
