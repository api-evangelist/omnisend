- target: $.paths['/brands/current'].get
  description: Tag GET /brands/current as Brands.
  update:
    tags:
    - Brands
- target: $.paths['/brands/current'].post
  description: Tag POST /brands/current as Brands.
  update:
    tags:
    - Brands
- target: $.paths['/brands/current'].get
  description: Add a stable operationId for GET /brands/current; the published contract omits it, which blocks code generation
    and tool binding.
  update:
    operationId: get_brands_current
- target: $.paths['/brands/current'].post
