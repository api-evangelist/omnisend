extends: omnisend-products-api-openapi.yml
actions:
- target: $
  description: Apply the two declared security schemes at the document root. The published contract defines ApiKeyAuth and
    Bearer in components.securitySchemes but never applies them, so no operation states its auth requirement.
  update:
    security:
    - ApiKeyAuth: []
    - Bearer: []
- target: $
  description: Declare a document-level tag so every operation can be grouped. The published contract declares none.
  update:
    tags:
    - name: Products
      description: ''
- target: $.paths['/products'].get
  description: Tag GET /products as Products.
  update:
    tags:
    - Products
- target: $.paths['/products'].post
  description: Tag POST /products as Products.
  update:
    tags:
    - Products
- target: $.paths['/products/{productID}'].delete
  description: Tag DELETE /products/{productID} as Products.
  update:
