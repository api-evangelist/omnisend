          allOf:
          - $ref: '#/components/schemas/Annotation'
          description: Gmail annotation settings
      type: object
    Rule:
      description: Filter rule for conditional display of content
      properties:
        operator:
          description: Filter operator - comparison operator for the filter condition
          example: equals
          type: string
        property:
          allOf:
          - $ref: '#/components/schemas/FilterProperty'
          description: Filter property - property to filter on
        value:
          description: Filter value - value to compare against the property
          example: value
          type: string
      type: object
    Social:
      description: Social block for displaying social media icons and links
      properties:
        icons:
          description: Icons of the social media platforms
          items:
            $ref: '#/components/schemas/Icon'
          type: array
        shape:
          description: Shape of the social media icons
          example: circle
          type: string
        size:
          description: Size of the social media icons
          example: 24px
          type: string
      type: object
    OrderAddress:
      description: Postal address for billing or shipping
      properties:
        address1:
          description: Primary address line
          example: 123 Main St
          type: string
        address2:
          description: Secondary address line
          example: Apt 4B
          type: string
        city:
          description: City name
          example: San Francisco
          type: string
        company:
          description: Company name
          example: Acme Inc
          type: string
        country:
          description: Country name
          example: United States
          type: string
        countryCode:
          description: ISO country code
          example: US
          type: string
        firstName:
          description: First name
          example: John
          type: string
        lastName:
          description: Last name
          example: Doe
          type: string
        phone:
          description: Phone number
          example: +1-555-123-4567
          type: string
        state:
          description: State or province name
          example: California
          type: string
        stateCode:
          description: State or province code
          example: CA
          type: string
        zip:
          description: Postal code
          example: '94102'
          type: string
      type: object
  parameters:
    APIVersionHeader:
      description: API version that specifies the response format and behaviour
      in: header
      name: Omnisend-Version
      required: true
      schema:
        type: string
        default: '2026-03-15'
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
    Bearer:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://app.omnisend.com/oauth2/token
          scopes:
            email-templates.read: Allows reading email templates and universal layouts
            email-templates.write: Allows create, update, delete email templates and universal layouts
