openapi: 3.2.0
info:
  contact: {}
  title: Analytics Statistics API
  version: '5.0'
  x-api-evangelist:
    harvested: '2026-08-13'
    method: searched
    source: https://dash.readme.com/api/v1/api-registry/c7lis6msfxryyp
