aid: omnisend
name: Omnisend
description: >-
  Omnisend is an email and SMS marketing automation platform purpose-built
  for ecommerce, with deep integrations into Shopify, BigCommerce, WooCommerce,
  and other storefronts. The platform provides automation workflows, campaign
  builders, segmentation, popups and forms, and product recommendations to
  drive customer engagement and revenue. Omnisend's REST API exposes contacts,
  events, products, categories, carts, orders, and campaigns using an
  X-API-KEY header or OAuth 2.0 for app-based integrations.
