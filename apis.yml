aid: omnisend
name: Omnisend
description: Omnisend is a Lithuanian-headquartered email and SMS marketing automation platform purpose-built for
  ecommerce, with first-class integrations into Shopify, BigCommerce, WooCommerce, Magento, Wix, Square Online,
  and other storefronts. The platform unifies automation workflows, campaign builders, segmentation, popups and
  forms, web push, product recommendations, A/B testing, and reporting to drive customer engagement and revenue.
  The REST API at version 2026-03-15 is served from https://api.omnisend.com/api and covers contacts, events and
  custom event metadata, products, product categories, segments, campaigns, automations, batches, email templates,
  email content, universal layouts, images, brands and analytics — 82 published operations across 15 OpenAPI 3.0.0
  documents. Authentication is an API key on the Authorization header (Omnisend-API-Key {key}) or OAuth 2.0 authorization
  code with PKCE and 26 resource scopes; every request must also carry an Omnisend-Version header, and a retired
  version returns 410. Omnisend additionally operates two first-party hosted MCP servers at mcp.omnisend.com and
  is listed in Claude's Connector Directory.
type: Index
kind: contract
