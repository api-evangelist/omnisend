generated: '2026-08-13'
method: searched
source: >-
  registry metadata endpoints (repo.packagist.org, registry.npmjs.org, api.wordpress.org),
  api.github.com/orgs/omnisend/repos, and https://api-docs.omnisend.com/reference/getting-started
description: >-
  First-party Omnisend client libraries and platform plugins, read from the registries that publish
  their version and release date. The finding worth recording is that Omnisend's only first-party
  API SDK — omnisend/php-sdk on Packagist — last released 1.2 on 2020-07-24 and wraps API v3, while
  the current contract is 2026-03-15 served at https://api.omnisend.com/api. Its GitHub repository
  is archived. Omnisend's living distribution effort is in WordPress/WooCommerce plugins, not SDKs.
  Omnisend's own getting-started page points integrators at raw curl and the Postman collection —
  it does not offer an SDK.

packages:
  - language: php
    registry: packagist
    name: omnisend/php-sdk
    url: https://packagist.org/packages/omnisend/php-sdk
    repository: https://github.com/omnisend/php-sdk
    install: composer require omnisend/php-sdk
    official: true
    kind: sdk
    version: '1.2'
    published: '2020-07-24'
    api_version_wrapped: v3
    note: >-
      Stale. Three published versions total; latest 1.2 (2020-07-24). Describes itself as a
      "Simple to use Omnisend API v3 wrapper". The GitHub repository is ARCHIVED (last push
      2021-07-01). It cannot reach the 2026-03-15 contract, which requires the
      `Omnisend-Version` header and the /api base path. 256,399 lifetime installs.

