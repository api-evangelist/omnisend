naftiko: 1.0.0-alpha2
info:
  label: Omnisend REST API — Events
  description: 'Omnisend Events capability. Submit predefined and custom customer events to drive segmentation, personalization, and automation triggers. Self-contained Naftiko capability.'
  tags:
    - Omnisend
    - Events
    - Ecommerce
    - Automation
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
  - namespace: env
    keys:
      OMNISEND_API_KEY: OMNISEND_API_KEY
capability:
  consumes:
    - type: http
      namespace: events
      baseUri: https://api.omnisend.com/v5
      description: Omnisend Events business capability.
      resources:
        - name: events
          path: /events
          operations:
            - name: sendEvent
              method: POST
              description: Send a customer event
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
      authentication:
        type: apikey
        key: X-API-KEY
        value: '{{env.OMNISEND_API_KEY}}'
        placement: header
  exposes:
    - type: rest
      namespace: events-rest
      port: 8080
      description: REST adapter for Omnisend Events.
      resources:
        - path: /v1/events
          name: events
          operations:
            - method: POST
              name: sendEvent
              call: events.sendEvent
              with:
                body: rest.body
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: events-mcp
      port: 9090
      transport: http
      description: MCP adapter for Omnisend Events.
      tools:
        - name: omnisend-send-event
          description: Send an Omnisend customer event
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: events.sendEvent
          with:
            body: tools.body
          outputParameters:
            - type: object
              mapping: $.
